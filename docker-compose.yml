services:
  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product_service_user
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
      POSTGRES_DB: product_service_db
    ports:
      - "5433:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_service_user -d product_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ./services/ProductService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ProductDb: Host=product-db;Port=5432;Database=product_service_db;Username=product_service_user;Password=${PRODUCT_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      product-db:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_service_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_service_db
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service_user -d auth_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/AuthService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDb: Host=auth-db;Port=5432;Database=auth_service_db;Username=auth_service_user;Password=${AUTH_DB_PASSWORD}
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM}
    ports:
      - "5101:8080"
    depends_on:
      auth-db:
        condition: service_healthy

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order_service_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: order_service_db
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service_user -d order_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./services/OrderService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__OrderDb: Host=order-db;Port=5432;Database=order_service_db;Username=order_service_user;Password=${ORDER_DB_PASSWORD}
      Jwt__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM}
      Services__ProductService__BaseUrl: http://product-service:8080
    ports:
      - "5102:8080"
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment_service_user
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: payment_service_db
    ports:
      - "5436:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_service_user -d payment_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ./services/PaymentService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PaymentDb: Host=payment-db;Port=5432;Database=payment_service_db;Username=payment_service_user;Password=${PAYMENT_DB_PASSWORD}
      Jwt__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM}
      Services__OrderService__BaseUrl: http://order-service:8080
      Services__OrderService__ServiceToken: ${PAYMENT_SERVICE_JWT}
      Services__NotificationService__BaseUrl: http://notification-service:8080
    ports:
      - "5103:8080"
    depends_on:
      payment-db:
        condition: service_healthy
      order-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build:
      context: ./services/NotificationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM}
    ports:
      - "5104:8080"

  api-gateway:
    build:
      context: ./services/ApiGateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address: http://auth-service:8080
      ReverseProxy__Clusters__products-cluster__Destinations__destination1__Address: http://product-service:8080
      ReverseProxy__Clusters__orders-cluster__Destinations__destination1__Address: http://order-service:8080
      ReverseProxy__Clusters__payments-cluster__Destinations__destination1__Address: http://payment-service:8080
      ReverseProxy__Clusters__notifications-cluster__Destinations__destination1__Address: http://notification-service:8080
    ports:
      - "5100:8080"
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  product-db-data:
  auth-db-data:
  order-db-data:
  payment-db-data:
